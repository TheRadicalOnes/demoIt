<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>demoIt — deck</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="page">
    <h1>Your deck</h1>
    <p class="lede">
      A deck is one folder: a <code>.md</code> file and its images. Everything demoIt found in it is
      listed below — read it before you present, not after.
    </p>

    <div class="pick">
      <input id="folder" type="file" webkitdirectory multiple />
      <button id="forget" class="button" type="button" hidden>Forget this deck</button>
    </div>

    <p id="summary" class="summary"></p>
    <div id="report"></div>

    <footer>
      Reload any tab you already have open after loading a new deck. Everything else — presenting,
      switching demoIt off — is in the toolbar panel.
    </footer>

    <script src="options.js"></script>
  </body>
</html>
