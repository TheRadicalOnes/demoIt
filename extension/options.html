<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>demoIt</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #16325c;
        --body: #3e3e3c;
        --weak: #747474;
        --rule: #e5e9ef;
        --accent: #0176d3;
        --bg: #fff;
        --panel: #f7f9fb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8eef7;
          --body: #c6d0dd;
          --weak: #8a94a3;
          --rule: #2a3240;
          --accent: #57a8ea;
          --bg: #14171c;
          --panel: #1b1f26;
        }
      }

      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 24px 80px;
        font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
        color: var(--body);
        background: var(--bg);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 600;
        color: var(--ink);
      }

      .lede {
        margin: 0 0 28px;
        color: var(--weak);
      }

      .pick {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 10px;
      }

      button {
        padding: 7px 14px;
        font: inherit;
        font-size: 14px;
        color: var(--body);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 7px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .summary {
        margin: 24px 0 8px;
        padding: 12px 14px;
        font-weight: 500;
        color: var(--ink);
        background: var(--panel);
        border-left: 3px solid var(--rule);
        border-radius: 0 7px 7px 0;
      }

      .summary.good { border-left-color: #2e844a; }
      .summary.warn { border-left-color: #a86403; }
      .summary.bad { border-left-color: #ba0517; }

      .block {
        margin-top: 26px;
      }

      .block h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--weak);
      }

      .block.warn h2 {
        color: #a86403;
      }

      .block ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--rule);
      }

      .block li {
        padding: 7px 2px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
        border-bottom: 1px solid var(--rule);
        overflow-wrap: anywhere;
      }

      footer {
        margin-top: 40px;
        padding-top: 16px;
        font-size: 13px;
        color: var(--weak);
        border-top: 1px solid var(--rule);
      }
    </style>
  </head>
  <body>
    <h1>demoIt</h1>
    <p class="lede">Slides on top of the application you are demoing.</p>

    <div class="pick">
      <input id="folder" type="file" webkitdirectory multiple />
      <button id="forget" type="button" hidden>Forget this deck</button>
    </div>

    <p id="summary" class="summary"></p>
    <div id="report"></div>

    <footer>
      A deck is one folder: a <code>.md</code> file and its images. Reload any tab you already have
      open after loading a new deck.
    </footer>

    <script src="options.js"></script>
  </body>
</html>
